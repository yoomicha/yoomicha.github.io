<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advanced AI Revenue Workspace — One Consistent Tool for Every Seller Role | Yoomi Cha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
<style>
  :root{
    --bg:#ffffff; --ink:#15171c; --muted:#6b7280; --faint:#9aa1ab; --rule:#e7e9ec;
    --accent:#0c60ff; --accent-soft:#eaf1ff; --navy:#0c1d4d; --navy-2:#132a63;
    --radius:10px; --maxw:980px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;}
  a{color:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  /* NAV */
  nav.site-nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--rule);}
  nav.site-nav .nav-inner{max-width:var(--maxw); margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; height:60px;}
  nav.site-nav .brand{text-decoration:none; font-size:15px; font-weight:700; color:var(--ink);}
  nav.site-nav ul{margin:0; padding:0; display:flex; gap:28px; list-style:none; align-items:center;}
  nav.site-nav a{text-decoration:none; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s ease;}
  nav.site-nav a:hover{color:var(--ink);}

  .eyebrow{font-size:24px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); margin:0 0 8px;}

  /* HERO */
  .hero{padding:72px 0 0;}
  .hero h1{font-size:clamp(28px,4vw,40px); font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; line-height:1.15;}
  .hero .sub{color:var(--muted); font-size:17px; width:100%; margin:0 0 40px;}

  .meta-row{display:grid; grid-template-columns:1.6fr 1fr; gap:48px; padding-bottom:56px;}
  .meta-row p{margin:0; color:var(--muted); font-size:15px;}
  .meta-row .eyebrow{color:var(--ink); font-size:24px; margin-bottom:8px;}
  .meta-cols{display:grid; grid-template-columns:1fr; gap:24px; align-content:start;}
  .meta-cols div p{color:var(--ink); font-weight:500; font-size:15px;}
  @media (max-width:720px){ .meta-row{grid-template-columns:1fr; gap:28px;} }

  /* STAT ROW */
  .stat-row{border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    display:grid; grid-template-columns:repeat(4,1fr); padding:36px 0; margin-bottom:40px;}
  .stat{padding:0 20px; border-left:1px solid var(--rule);}
  .stat:first-child{border-left:none; padding-left:0;}
  .stat .num{font-size:clamp(26px,3.4vw,34px); font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .stat .label{margin-top:6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  @media (max-width:720px){ .stat-row{grid-template-columns:1fr 1fr; row-gap:24px;} .stat:nth-child(3){border-left:none; padding-left:0;} }

  /* SECTIONS */
  section{padding:64px 0;}
  section.tight{padding:40px 0;}
  h2.section-title{font-size:18px; font-weight:400; letter-spacing:-0.01em; margin:0 0 15px; color:var(--muted);}
  .rule{border:none; border-top:1px solid var(--rule); margin:0 0 24px 0;}

  .band{background:linear-gradient(160deg,var(--navy),var(--navy-2)); color:#fff; border-radius:16px; padding:56px 48px; margin:56px 0;}
  .band h2{font-size:30px; font-weight:800; margin:0 0 10px;}
  .band p{color:#c9d2ec; max-width:620px; margin:0; font-size:15px;}

  .prose{width:100%; max-width:var(--maxw); color:var(--ink); font-size:16px;}
  .prose p{margin:0 0 20px;}
  .prose p:last-child{margin-bottom:0;}
  .prose ul{padding-left:20px; margin:0 0 20px;}
  .prose li{margin-bottom:10px;}

  .callout{border-left:2px solid var(--accent); padding:4px 0 4px 20px; margin:20px 0;}
  .callout .tag{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .callout p{margin:0; color:var(--muted); font-size:14.5px;}

  /* FINDING / DESIGN POINT BLOCK */
  .finding{display:grid; grid-template-columns:1.3fr 1fr; gap:40px; padding:44px 0; border-top:1px solid var(--rule); align-items:start;}
  .finding h3{font-size:19px; font-weight:700; margin:0 0 4px;}
  .finding .kicker{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 8px;}
  .finding p{color:var(--muted); font-size:15px; margin:0 0 14px;}
  .finding img{width:100%; border-radius:8px; border:1px solid var(--rule); display:block;}
  @media (max-width:800px){ .finding{grid-template-columns:1fr;} }

  /* IMAGES */
  .frame{margin:32px 0;}
  .frame img{width:100%; border-radius:10px; border:1px solid var(--rule); display:block;}
  .frame .cap{font-size:13px; color:var(--faint); margin-top:10px;}
  .shot{width:100%; height:auto; display:block; border-radius:10px; border:1px solid var(--rule); background:#fff;}
  .shot--anim{aspect-ratio:16/9; object-fit:contain; padding:6% 18%; background:#fafafa;}
  .img-placeholder{aspect-ratio:4/3; border-radius:8px; border:1px dashed #c8ccd2; background:#fafafa;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--faint); font-size:13px; text-align:center; padding:16px;}
  .img-placeholder b{color:var(--muted); font-weight:600;}
  .img-placeholder.wide{aspect-ratio:16/9;}
  .img-placeholder.pair{aspect-ratio:3/2;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:24px;}
  .grid2 h4,.grid3 h4,.grid4 h4{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:0 0 12px;}
  .grid2 ul{margin:0; padding-left:18px; color:var(--ink); font-size:15px;}
  .grid2 li{margin-bottom:10px;}
  .grid2 p{color:var(--muted); font-size:15px; margin:0 0 12px;}
  @media (max-width:720px){ .grid2{grid-template-columns:1fr;} }

  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:24px;}
  .grid3 p{color:var(--muted); font-size:15px; margin:0;}
  @media (max-width:720px){ .grid3{grid-template-columns:1fr;} }

  /* WORKFLOW STEPS */
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:24px; counter-reset:step;}
  .step{border:1px solid var(--rule); border-radius:var(--radius); padding:20px 18px; position:relative; background:#fff;}
  .step .n{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); margin-bottom:8px; display:block;}
  .step h4{font-size:15px; font-weight:700; color:var(--ink); text-transform:none; letter-spacing:0; margin:0 0 6px;}
  .step p{margin:0; color:var(--muted); font-size:13.5px;}
  @media (max-width:800px){ .grid4{grid-template-columns:1fr 1fr;} }
  @media (max-width:480px){ .grid4{grid-template-columns:1fr;} }

  /* HUMAN-IN-THE-LOOP CARDS */
  .loop-card{border:1px solid var(--rule); border-radius:var(--radius); padding:24px;}
  .loop-card .pill{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--accent-soft); color:var(--accent); padding:4px 10px; border-radius:999px; margin-bottom:12px;}
  .loop-card h3{font-size:17px; margin:0 0 8px;}
  .loop-card p{margin:0; color:var(--muted); font-size:15px;}

  footer{border-top:1px solid var(--rule); margin-top:40px; padding:32px 0 64px; color:var(--faint); font-size:13px;}
  footer .wrap{display:flex; justify-content:space-between; align-items:center;}
  /* EMBEDDED PROTOTYPE */
  .proto{margin:-8px 0 56px;}
  .proto .proto-cta{margin:0 0 16px;}
  .proto-embed{width:min(1200px, calc(100vw - 48px)); margin-left:50%; transform:translateX(-50%); height:min(78vh, 760px);
    border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:#f3f4f6; box-shadow:0 12px 40px rgba(12,29,77,.10);}
  .proto-frame{display:block; width:100%; height:100%; border:0;}
  .proto-mobile{display:none; margin:0; font-size:14px; color:var(--muted);}
  @media (max-width:720px){ .proto-embed{display:none;} .proto-mobile{display:block;} }
  /* PROTOTYPE LINK */
  .proto-cta{display:flex; align-items:center; justify-content:space-between; gap:24px; margin:-8px 0 48px; padding:20px 24px;
    border:1px solid var(--rule); border-radius:var(--radius); background:var(--accent-soft);}
  .proto-title{margin:0 0 4px; font-size:16px; font-weight:700; color:var(--ink);}
  .proto-desc{margin:0; font-size:14px; color:var(--muted);}
  .proto-btn{flex:none; display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600; text-decoration:none; transition:background .15s ease;}
  .proto-btn:hover{background:var(--navy-2);}
  .proto-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  @media (max-width:720px){ .proto-cta{flex-direction:column; align-items:flex-start;} }
  /* password gate */
  .unlocking{min-height:60vh; display:grid; place-items:center; color:var(--muted); font-size:14px;}
</style>
</head>
